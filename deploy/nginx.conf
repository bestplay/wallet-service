http {
    upstream wallet_http {
        least_conn;
        server wallet-service-1:8080;
        server wallet-service-2:8080;
        server wallet-service-3:8080;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://wallet_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

stream {
    upstream wallet_grpc {
        least_conn;
        server wallet-service-1:50051;
        server wallet-service-2:50051;
        server wallet-service-3:50051;
    }

    server {
        listen 50051;
        proxy_pass wallet_grpc;
    }
}

events {
    worker_connections 1024;
}
